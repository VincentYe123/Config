[custom]
;================= 规则 =================

; 广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_domainset.txt

; AI
ruleset=🤖 OpenAi,https://gist.githubusercontent.com/ddgksf2013/cb4121e8b5c5d865cc949cb8120320c4/raw/Ai.yaml

; 哔哩哔哩 / 巴哈姆特
ruleset=📺 哔哩哔哩,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/BiliBili/BiliBili.yaml
ruleset=📺 哔哩哔哩,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Bahamut/Bahamut.yaml

; 国际媒体
ruleset=🎬 国际媒体,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GlobalMedia/GlobalMedia_Classical.yaml

; 苹果
ruleset=🍎 苹果服务,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Apple/Apple_Classical.yaml

; 全球加速
ruleset=🌏 全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GitHub/GitHub.yaml
ruleset=🌏 全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.yaml
ruleset=🌏 全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ProxyLite/ProxyLite.yaml
ruleset=🌏 全球加速,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Twitter/Twitter.yaml

; Google / Telegram
ruleset=🌌 谷歌服务,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Google/Google.yaml
ruleset=📟 电报消息,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Telegram/Telegram.yaml

; 游戏
ruleset=🎮 游戏平台,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Game/Game.yaml

; 直连
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Direct/Direct.yaml
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Lan/Lan.yaml
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Download/Download.yaml
ruleset=🎯 全球直连,https://raw.githubusercontent.com/VincentYe123/Config/main/rules/job.list

ruleset=🎯 全球直连,[]GEOIP,CN

; 兜底
ruleset=🐟 漏网之鱼,[]FINAL


;================= 策略组 =================

; 主入口（建议平时选“🌏 全球加速”）
custom_proxy_group=🚀 节点选择`select`[]🌏 全球加速`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🚀 手动切换`[]DIRECT

; 各功能分流
custom_proxy_group=🍎 苹果服务`select`[]🌏 全球加速`[]DIRECT
custom_proxy_group=📺 哔哩哔哩`select`[]DIRECT`[]🇭🇰 香港节点`[]🇨🇳 台湾节点
custom_proxy_group=🤖 OpenAi`select`[]🇺🇲 美国节点`[]🌏 全球加速
custom_proxy_group=🎬 国际媒体`select`[]🌏 全球加速
custom_proxy_group=🌌 谷歌服务`select`[]🌏 全球加速
custom_proxy_group=📟 电报消息`select`[]🌏 全球加速
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🌏 全球加速
custom_proxy_group=🆎 广告拦截`select`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🌏 全球加速`[]DIRECT


;================= 智能选路（核心优化） =================

; 手动
custom_proxy_group=🚀 手动切换`select`.*

; 全量测速（兜底）
custom_proxy_group=♻️ 自动选择`url-test`.*`http://cp.cloudflare.com/generate_204`300,,50

; 分地区测速（第一层）
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|HongKong)`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Tokyo|Japan)`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美国|US|United States|America)`http://cp.cloudflare.com/generate_204`300,,100
custom_proxy_group=🇨🇳 台湾节点`url-test`(台湾|TW|Taiwan)`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|SG|Singapore)`http://cp.cloudflare.com/generate_204`300,,50

; 全球优选（第二层，关键）
custom_proxy_group=🌏 全球加速`url-test`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`http://cp.cloudflare.com/generate_204`300,,50


;================= 其他 =================

enable_rule_generator=true
overwrite_original_rules=true

; ⚠️ 不要再过滤“香港”
exclude_remarks=(到期|官方|Traffic|Expire|剩余|时间|官网|产品|俄罗斯|最新网址)
